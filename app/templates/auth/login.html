{% extends "base.html" %}
{% block title %}Login - Dawn Defender{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Log in</h2>
    <form method="POST">
        <label for="username_or_email">Username or Email</label>
        <input type="text" id="username_or_email" name="username_or_email" value="{{ username_or_email or '' }}" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
