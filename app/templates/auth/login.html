{% extends "base.html" %}
{% block title %}Login — Dawn Defender{% endblock %}
{% block content %}

<div class="form-card">
    <h2>Welcome back</h2>
    <p class="form-sub">Sign in to your Dawn Defender account to start scanning URLs, SMS, and Emails.</p>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Sign In →</button>
    </form>
    <p class="form-footer">Don't have an account yet? <a href="{{ url_for('auth.register') }}">Create one free</a></p>
</div>

{% endblock %}
