{% extends "base.html" %}
{% block title %}App File Inspector — Dawn Defender{% endblock %}
{% block content %}

<div class="scan-header">
    <div class="scan-header-title">
        <div class="feature-icon icon-apk">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
                <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
        </div>
        <h1>Phone App Safety Inspector</h1>
    </div>
    <p>Upload a downloaded phone app file to inspect its hidden permissions and verify whether it's safe to install on your phone.</p>
</div>

<div class="scan-card">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="apk_file">Select App File (.apk)</label>
            <input type="file" id="apk_file" name="apk_file" accept=".apk">
        </div>
        <div class="form-group">
            <label for="filename">Or Enter App File Name</label>
            <input type="text" id="filename" name="filename" placeholder="e.g. Free_Bank_Rewards_v2.apk">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Check App Safety →</button>
    </form>
</div>

{% endblock %}
