{% extends "base.html" %}
{% block title %}Email Safety Check — Dawn Defender{% endblock %}
{% block content %}

<div class="scan-header">
    <div class="scan-header-title">
        <div class="feature-icon icon-email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
        </div>
        <h1>Email Safety Checker</h1>
    </div>
    <p>Paste an email body or sender address to verify whether it truly came from your bank or an official service.</p>
</div>

<div class="scan-card">
    <form method="POST">
        <label for="text">Paste Email Text or Sender Address</label>
        <textarea id="text" name="text" rows="8" placeholder="Paste full email text or sender email address here...&#10;&#10;e.g. Subject: URGENT: Your bank account is suspended&#10;Dear Customer, click here to verify your details: http://..." required></textarea>
        <button type="submit" class="btn btn-primary">Check Email Safety →</button>
    </form>
</div>

{% endblock %}
