{% extends "base.html" %}
{% block title %}URL Scanner — Dawn Defender{% endblock %}
{% block content %}

<div class="scan-header">
    <h1>🔗 URL Scanner</h1>
    <p>Paste any suspicious link — we'll analyze 79 structural and lexical features instantly.</p>
</div>

<div class="scan-card">
    <form method="POST">
        <label for="url">Suspicious URL</label>
        <input type="text" id="url" name="url" placeholder="https://example-suspicious-link.xyz/login" required autocomplete="off" spellcheck="false">
        <button type="submit" class="btn btn-primary">Analyze URL →</button>
    </form>
</div>

{% endblock %}
