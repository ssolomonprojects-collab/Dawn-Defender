{% extends "base.html" %}
{% block title %}Link Checker — Dawn Defender{% endblock %}
{% block content %}

<div class="scan-header">
    <div class="scan-header-title">
        <div class="feature-icon icon-url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
        </div>
        <h1>Website Link Checker</h1>
    </div>
    <p>Paste any web link or website address to verify whether it's safe or a dangerous scam site.</p>
</div>

<div class="scan-card">
    <form method="POST">
        <label for="url">Paste Website Link</label>
        <input type="text" id="url" name="url" placeholder="Paste link here (e.g. https://example-link.com)" required autocomplete="off" spellcheck="false">
        <button type="submit" class="btn btn-primary">Check Link Safety →</button>
    </form>
</div>

{% endblock %}
