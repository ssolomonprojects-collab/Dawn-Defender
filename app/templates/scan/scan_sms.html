{% extends "base.html" %}
{% block title %}Text Message Shield — Dawn Defender{% endblock %}
{% block content %}

<div class="scan-header">
    <div class="scan-header-title">
        <div class="feature-icon icon-sms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <h1>Text Message Scam Shield</h1>
    </div>
    <p>Paste any suspicious text message to check for fake delivery alerts, urgent bank traps, or secret code traps.</p>
</div>

<div class="scan-card">
    <form method="POST">
        <label for="text">Paste Text Message Content</label>
        <textarea id="text" name="text" rows="6" placeholder="Paste message text here...&#10;&#10;e.g. Your electricity bill of Rs.3,200 is overdue. Pay immediately to prevent disconnection: http://..." required></textarea>
        <button type="submit" class="btn btn-primary">Check Message Safety →</button>
    </form>
</div>

{% endblock %}
