{% extends "base.html" %}
{% block title %}SMS Scanner — Dawn Defender{% endblock %}
{% block content %}

<div class="scan-header">
    <h1>💬 SMS Scanner</h1>
    <p>Paste a suspicious text message — AI checks for scam patterns, urgency traps, and malicious links.</p>
</div>

<div class="scan-card">
    <form method="POST">
        <label for="text">SMS Message</label>
        <textarea id="text" name="text" rows="5" placeholder="Paste the suspicious SMS here...&#10;&#10;e.g. URGENT: Your account has been suspended. Verify at http://..." required></textarea>
        <button type="submit" class="btn btn-primary">Analyze Message →</button>
    </form>
</div>

{% endblock %}
